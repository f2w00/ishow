<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>

<body>
    <div>123</div>
    <script>
        window.onload = function () {
            try {
                window.parent.ishow.windowEvent.on('leftBar:created.easy-report', (data) => {
                    data.forEach((info) => {
                        window.parent.ishow.windowEvent.emit(`mainTab:create`, info)
                        window.parent.ishow.windowEvent.emit(`leftBar:close`, info.name)
                    })
                })
            } catch (error) {
                console.log(error);
            }
        }
    </script>
</body>

</html>
<style>
    html,
    body {
        height: 90%;
        width: 90%;
    }
</style>
